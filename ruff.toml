# Exclude a variety of commonly ignored directories.
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
]

# Same as Black.
line-length = 100
indent-width = 4

# Auto-detect Python version (supports Python 3.13)
target-version = "py313"

[lint]
# Full pydocstyle (D) across application and test code; migrations exempt below.
select = ["E", "F", "B", "I", "D"]
ignore = [
    "E501",
    "B008",
    "B904",
    "D105",  # missing docstring in magic method (__str__, etc.)
]

fixable = ["ALL"]
unfixable = []

dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[lint.per-file-ignores]
"src/migrations/**/*.py" = ["D"]

[lint.pydocstyle]
convention = "google"

[lint.isort]
force-single-line = false
known-first-party = ["app"]
known-third-party = ["fastapi", "pydantic", "sqlalchemy"]

[format]
# Like Black, use double quotes for strings.
quote-style = "double"

# Like Black, indent with spaces, rather than tabs.
indent-style = "space"

# Like Black, respect magic trailing commas.
skip-magic-trailing-comma = false

# Like Black, automatically detect the appropriate line ending.
line-ending = "auto"
